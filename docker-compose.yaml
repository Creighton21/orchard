services:
  rabbitmq:
    image: rabbitmq:management
    container_name: orchard-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  postgres:
    image: postgres:latest
    container_name: orchard-postgres
    environment:
      POSTGRES_DB: orchard
      POSTGRES_USER: orchard
      POSTGRES_PASSWORD: orchard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: